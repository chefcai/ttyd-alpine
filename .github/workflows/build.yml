name: Build and Push ttyd Alpine Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # Daily at 06:30 UTC (staggered 30 min after bazarr-alpine).
    # Skips the build automatically only when both the ttyd version AND the
    # upstream tsl0922/ttyd:alpine base digest already match what's published,
    # so Alpine/openssh-client security fixes in the base image still land
    # even when the ttyd version itself hasn't changed.
    - cron: '30 6 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_IMAGE: tsl0922/ttyd:alpine

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get ttyd version
        id: ttyd_version
        run: |
          VERSION=$(docker run --rm "${{ env.BASE_IMAGE }}" ttyd --version 2>&1 | grep -oP '\d+\.\d+\.\d+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ttyd version: $VERSION"

      - name: Get upstream base image digest
        id: base_digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ env.BASE_IMAGE }}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "upstream ${{ env.BASE_IMAGE }} digest: $DIGEST"

      - name: Check if this version+digest is already published
        id: check
        run: |
          VERSION="${{ steps.ttyd_version.outputs.version }}"
          UPSTREAM_DIGEST="${{ steps.base_digest.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"

          if docker pull "$IMAGE_REF" --quiet >/dev/null 2>&1; then
            RECORDED_DIGEST=$(docker inspect "$IMAGE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' 2>/dev/null || true)
            if [ "$RECORDED_DIGEST" = "$UPSTREAM_DIGEST" ]; then
              echo "needs_build=false" >> $GITHUB_OUTPUT
              echo "::notice::Version $VERSION already published with current base digest — skipping build."
            else
              echo "needs_build=true" >> $GITHUB_OUTPUT
              echo "::notice::Version $VERSION published, but upstream base digest changed ($RECORDED_DIGEST -> $UPSTREAM_DIGEST) — will rebuild."
            fi
          else
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION not yet published — will build."
          fi

      - name: Determine whether to run the build
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.check.outputs.needs_build }}" != "true" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

          # Never push on pull_request builds — build-only validation.
          # Only refs/heads/main gets the production tags (latest + version);
          # any other ref (e.g. workflow_dispatch on a test branch) gets a
          # branch-scoped tag only, so a manual dispatch can never overwrite
          # :latest / the version tag. See HOMELAB-91: radarr/sonarr/prowlarr
          # hit this same trap without a tag_suffix.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> $GITHUB_OUTPUT
            echo "channel=none" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >> $GITHUB_OUTPUT
            echo "channel=production" >> $GITHUB_OUTPUT
          else
            echo "push=true" >> $GITHUB_OUTPUT
            echo "channel=test" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: steps.gate.outputs.run == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.gate.outputs.channel == 'production' }}
            type=raw,value=${{ steps.ttyd_version.outputs.version }},enable=${{ steps.gate.outputs.channel == 'production' }}
            type=raw,value=branch-${{ github.ref_name }},enable=${{ steps.gate.outputs.channel == 'test' }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ steps.gate.outputs.channel == 'none' }}
          labels: |
            org.opencontainers.image.base.digest=${{ steps.base_digest.outputs.digest }}

      - name: Build and push Docker image
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
